  </defs>
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
  <text x="40" y="48" class="kick">INDUSTRY DOMAINS · 산업 도메인</text>
  <line x1="40" y1="64" x2="720" y2="64" stroke="#0f0f0f" stroke-width="2"/>

  <!-- grid 4 x 3, cells 170w x 138h, origin 40,86 -->
