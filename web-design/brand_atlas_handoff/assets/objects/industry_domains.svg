<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="브랜드 아틀라스 산업 도메인 지도">
  <defs>
    <style>
      .lbl{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:17px;font-weight:500;fill:#0f0f0f}
      .kick{font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:700;letter-spacing:3px;fill:#6b7280}
      .gl{fill:none;stroke:#0f0f0f;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .glr{fill:none;stroke:#ed1f26;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
      .cell{fill:none;stroke:#e5e7eb;stroke-width:1.4}
