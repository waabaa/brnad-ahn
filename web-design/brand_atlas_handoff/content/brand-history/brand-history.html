<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>브랜드의 역사, 인장에서 AI까지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#D8DBE0;--paper:#ECEEF1;--paper2:#E4E7EB;--ink:#15171B;--muted:#586070;--line:rgba(21,23,27,.12);--panel:#F8F9FA;--shadow:rgba(20,24,32,.22);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161B;--paper:#1C1F25;--paper2:#191C21;--ink:#ECEEF2;--muted:#9AA2AF;--line:rgba(236,238,242,.1);--panel:#22262D;--shadow:rgba(0,0,0,.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161B;--paper:#1C1F25;--paper2:#191C21;--ink:#ECEEF2;--muted:#9AA2AF;--line:rgba(236,238,242,.1);--panel:#22262D;--shadow:rgba(0,0,0,.55);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:flex-end;gap:12px 20px;padding:14px 18px 10px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(22px,3.2vw,36px);font-weight:700;letter-spacing:-.035em;line-height:1}
.sub{color:var(--muted);font-size:13px;margin-top:7px}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,input{font:inherit;font-size:13px}
button{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.search{position:relative}
.search input{width:200px;max-width:56vw;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 44px 7px 13px;border-radius:999px}
.search small{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:11px;pointer-events:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 18px 10px}
.chips::-webkit-scrollbar{display:none}
.chips button{padding:5px 11px;font-size:12px;display:flex;align-items:center;gap:6px;flex:none}
.chips button i{width:10px;height:10px;border-radius:2px;flex:none}
.chips button[aria-pressed]{background:var(--panel);color:var(--ink);border-color:var(--muted)}
.chips button[aria-pressed="false"]{opacity:.45;border-color:var(--line)}
#wrap{position:relative;flex:1;min-height:0;display:flex}
#sc{flex:1;overflow:auto;position:relative;overscroll-behavior:contain}
#grid{--cols:10;min-width:calc(78px + var(--cols) * 116px);}
.lh,.row{display:grid;grid-template-columns:78px repeat(var(--cols),minmax(116px,1fr))}
.lh{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.lh div{padding:8px 8px 7px;font-size:12px;font-weight:700;letter-spacing:-.01em;line-height:1.25;border-top:4px solid var(--lc);color:var(--ink)}
.lh div:first-child{border-top-color:transparent;color:var(--muted);font-weight:500;position:sticky;left:0;background:var(--bg);z-index:2}
.era{position:sticky;top:var(--lhh,44px);z-index:10;color:#fff;padding:10px 14px 9px;display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.era b{font-size:clamp(20px,2.4vw,30px);letter-spacing:-.035em;line-height:1}
.era span{font-size:13px;opacity:.9}
.era em{font-style:normal;font-size:12px;opacity:.8;margin-left:auto;font-variant-numeric:tabular-nums}
.row{transform-origin:50% 0;border-bottom:1px solid var(--line);background:var(--paper)}
.row.alt{background:var(--paper2)}
.yr{position:sticky;left:0;z-index:3;background:inherit;padding:8px 6px 8px 10px;font-size:13px;font-weight:700;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums;border-right:1px solid var(--line)}
.yr small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);margin-top:2px}
.cell{padding:3px;display:flex;flex-direction:column;gap:3px;border-right:1px solid var(--line);min-width:0}
.cell.off,.lh .off{display:none}
.card{padding:5px 7px 6px 8px;border-left:3px solid rgba(0,0,0,.28);cursor:pointer;line-height:1.22;transition:transform .22s,box-shadow .22s,opacity .3s;min-width:0}
.card b{display:block;font-size:10.5px;font-weight:700;opacity:.8;font-variant-numeric:tabular-nums}
.card .t{display:block;font-size:12.5px;font-weight:700;letter-spacing:-.015em;overflow-wrap:anywhere}
.card .d{display:-webkit-box;font-size:10.5px;opacity:.85;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.card:hover{transform:translateZ(30px) scale(1.04);box-shadow:0 12px 24px var(--shadow);position:relative;z-index:5}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
.card.on{box-shadow:0 0 0 3px var(--ink),0 12px 26px var(--shadow);position:relative;z-index:6}
.card.dim{opacity:.1}
.now{background:#E0115F;color:#fff;padding:14px 16px;font-weight:700;font-size:15px}
.tail{height:55vh}
#rail{width:26px;flex:none;position:relative;background:var(--paper);border-left:1px solid var(--line);cursor:pointer;touch-action:none}
#rail .seg{position:absolute;left:5px;right:5px}
#rail .vw{position:absolute;left:1px;right:1px;border:2px solid var(--ink);border-radius:4px;pointer-events:none}
#detail{position:absolute;right:40px;top:14px;width:min(340px,calc(100% - 54px));max-height:calc(100% - 28px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px var(--shadow);z-index:30}
#detail[hidden]{display:none}
#detail .sw{height:92px;padding:12px 16px;display:flex;align-items:flex-end;justify-content:space-between}
#detail .py{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#detail .hx{font-size:12px;font-weight:500;opacity:.9}
#detail .x{position:absolute;top:10px;right:10px;width:32px;height:32px;padding:0;border-radius:50%;font-size:18px;line-height:1}
#detail .bd{padding:14px 16px 16px}
#detail h2{margin:0 0 4px;font-size:21px;letter-spacing:-.025em;line-height:1.25}
#detail .pl{font-size:12px;color:var(--muted);margin-bottom:10px}
#detail .pd{margin:0 0 14px;font-size:14.5px;line-height:1.6}
#detail h3{font-size:12px;color:var(--muted);font-weight:500;margin:0 0 6px}
#detail ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
#detail li button{width:100%;text-align:left;display:flex;gap:8px;align-items:center;border-radius:8px;padding:6px 8px;white-space:normal}
#detail li i{flex:none;width:12px;height:12px;border-radius:3px}
@media (max-width:640px){header{padding:10px 12px 8px}.sub{font-size:12px}.tools{margin-left:0}.chips{padding:0 12px 8px}#detail{right:34px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>브랜드의 역사, 인장에서 AI까지</h1>
    <div class="sub" id="sub"></div>
  </div>
  <div class="tools">
    <label class="search"><input id="q" type="search" placeholder="브랜드, 인물, 사건 찾기" aria-label="연대기 검색"><small id="qc"></small></label>
    <button id="play" aria-pressed="false">처음부터 재생</button>
    <button id="motion" aria-pressed="true">3D 모션</button>
    <button id="top">맨 위로</button>
  </div>
</header>
<div class="chips" id="eraChips" aria-label="시대로 이동"></div>
<div class="chips" id="laneChips" aria-label="분야 보이기 숨기기"></div>
<div id="wrap">
  <div id="sc"><div id="grid"></div></div>
  <div id="rail" aria-hidden="true"></div>
  <aside id="detail" hidden aria-live="polite">
    <div class="sw"><div class="py"></div><div class="hx"></div></div>
    <button class="x" aria-label="닫기">×</button>
    <div class="bd"><h2></h2><div class="pl"></div><p class="pd"></p><h3>같은 시기의 기록</h3><ul></ul></div>

[2023,'D','코카콜라 Y3000','AI와 함께 만든 맛','#F40009'],

[2026,'W','밀라노 코르티나 동계올림픽','2월, 이탈리아'],
[2026,'W','북중미 월드컵','미국, 캐나다, 멕시코 공동 개최, 48개국'],

[2026,'D','챗GPT 인스턴트 체크아웃 중단','3월, 대화형 결제의 첫 시행착오'],
[2026,'D','에이전틱 커머스','AI 에이전트가 고르고 사는 시대, 브랜드는 AI의 추천 목록에 들어야'],
[2026,'A','슈퍼볼 LX, AI 광고의 해','AI 서비스 광고가 10편 넘게 방영'],

[2026,'I','윌리엄스 F1 리브랜딩','1월, 새 이름과 로고, 파랑을 팀의 색으로','#00A0DE'],
[2026,'I','Xbox 브랜드 복귀','4월, Microsoft Gaming을 접고 초록 구체로','#107C10'],
[2026,'I','구글 워크스페이스 아이콘','평면 색면에서 빛나는 그라디언트로','#4285F4'],
[2026,'I','GF 스미스 리브랜딩','블랜딩 흐름에 맞선 대담한 아이덴티티'],
[2026,'I','63빌딩 새 아이덴티티','한화, 여의도 랜드마크의 새 옷','#F37321'],
[2026,'I','당근 SEED 리브랜딩','디자인 시스템 개편','#FF6F0F'],
[2026,'I','맥라렌 새 워드마크','9월 22일, 1920년대 가족 정비소 간판에서 온 글자, 파파야는 유지','#FF8000'],
[2026,'C','클라우드 댄서','팬톤 올해의 색, 처음으로 흰색','#F0EEE9'],

[2026,'K','올리브영 세포라 입점','8월, 미국 세포라 매장에 K뷰티 코너','#9BC53D']
];

const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function lum(h){h=h.replace('#','');const c=[0,2,4].map(i=>{let v=parseInt(h.substr(i,2),16)/255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
const fy=y=>y<0?'BC '+(-y):String(y);
const yl=d=>d.lab||fy(d.y);
const LBY={};LANES.forEach((l,i)=>{l.i=i;LBY[l.k]=l;l.on=true});
const DATA=RAW.map((r,i)=>({i,y:r[0],l:r[1],t:r[2],d:r[3]||'',c:r[4]||'',lab:r[5]||''}));
const cnt={};DATA.forEach(d=>{const ln=LBY[d.l];cnt[d.l]=(cnt[d.l]||0)+1;d.bg=d.c||ln.p[cnt[d.l]%3];d.fg=lum(d.bg)>.42?'#15171B':'#FFFFFF'});

// time buckets: coarse in antiquity, yearly in the AI era
const B=[-4000,-3000,-2000,-1000,-500,0,500,1000,1200,1400,1450,1500,1600,1700,1760,1800,1825,1850];
for(let y=1860;y<=1940;y+=10)B.push(y);
B.push(1945);for(let y=1950;y<=1995;y+=5)B.push(y);
for(let y=2000;y<=2018;y+=2)B.push(y);for(let y=2020;y<=2027;y++)B.push(y);
function blabel(a,b){if(b-a===1)return[String(a),''];
  if(a>=1850&&b-a===10&&a%10===0)return[a+'년대',''];
  if(a<500)return[fy(a),'~ '+fy(b)];return[String(a),'~ '+(b-1)]}

const grid=$('#grid');
let h='<div class="lh"><div>연도</div>'+LANES.map(l=>`<div data-k="${l.k}" style="--lc:${l.p[0]}">${l.n}</div>`).join('')+'</div>';
let ei=0,alt=0;
for(let bi=0;bi<B.length-1;bi++){const a=B[bi],b=B[bi+1];
  while(ei<ERAS.length&&ERAS[ei][0]<=a){const e=ERAS[ei];h+=`<div class="era" id="era${ei}" style="background:${e[4]}"><b>${e[2]}</b><span>${e[3]}</span><em>${fy(e[0])} ~ ${e[1]===2027?'지금':fy(e[1])}</em></div>`;ei++}
  const inb=DATA.filter(d=>d.y>=a&&d.y<b);if(!inb.length)continue;
  const [l1,l2]=blabel(a,b);
  h+=`<div class="row${alt++%2?' alt':''}"><div class="yr">${l1}${l2?`<small>${l2}</small>`:''}</div>`;
  LANES.forEach(l=>{h+=`<div class="cell" data-k="${l.k}">`;
    inb.filter(d=>d.l===l.k).sort((x,y)=>x.y-y.y||x.i-y.i).forEach(d=>{
      h+=`<div class="card" tabindex="0" data-i="${d.i}" style="background:${d.bg};color:${d.fg}"><b>${yl(d)}</b><span class="t">${d.t}</span>${d.d?`<span class="d">${d.d}</span>`:''}</div>`});
    h+='</div>'});
  h+='</div>'}
h+='<div class="now">지금, 2026년 9월. 다음 칸은 아직 비어 있습니다.</div><div class="tail"></div>';
grid.innerHTML=h;
const cards=[];grid.querySelectorAll('.card').forEach(el=>cards[+el.dataset.i]=el);
const rows=[...grid.querySelectorAll('.row')];
$('#sub').textContent=`${DATA.length}개의 기록, 기원전 원통인장에서 2026년 에이전틱 커머스까지. 아래로 스크롤하세요.`;

const sc=$('#sc');
const lhEl=grid.querySelector('.lh');
function setLhh(){grid.style.setProperty('--lhh',lhEl.offsetHeight+'px')}

// 3D scroll motion: rows fold up from the bottom edge and tip back under the header
let motion=!reduce;const mb=$('#motion');mb.setAttribute('aria-pressed',motion);
let ticking=false;
function paint(){ticking=false;const vh=sc.clientHeight,top=sc.getBoundingClientRect().top,lim=lhEl.offsetHeight+50,atEnd=sc.scrollTop+vh>=sc.scrollHeight-4;
  for(const r of rows){const b=r.getBoundingClientRect(),t0=b.top-top,t1=b.bottom-top;
    if(!motion||t1<-300||t0>vh+300){if(r._s){r.style.transform='';r.style.opacity='';r._s=0}continue}
    const inP=atEnd&&t1<=vh?1:Math.min(1,Math.max(0,(vh-t0)/(vh*.42))),outP=Math.min(1,Math.max(0,(t1-lim)/(vh*.18)));
    const ang=(1-inP)*55-(1-outP)*14,z=-(1-inP)*90;
    r.style.transform=`perspective(1100px) translateZ(${z.toFixed(1)}px) rotateX(${ang.toFixed(2)}deg)`;r.style.opacity=(.2+.8*Math.min(inP,.4+.6*outP)).toFixed(3);r._s=1}
  drawRail()}
function req(){if(!ticking){ticking=true;requestAnimationFrame(paint)}}
sc.addEventListener('scroll',req,{passive:true});
mb.onclick=()=>{motion=!motion;mb.setAttribute('aria-pressed',motion);req()};

// right rail: the whole history at a glance
const rail=$('#rail');let vw;
function buildRail(){rail.innerHTML='';const H=grid.scrollHeight;
  grid.querySelectorAll('.era').forEach((e,i)=>{const nx=grid.querySelector('#era'+(i+1));const s=document.createElement('div');s.className='seg';
    const a=e.offsetTop,b=nx?nx.offsetTop:H;s.style.top=(a/H*100)+'%';s.style.height=((b-a)/H*100)+'%';s.style.background=ERAS[i][4];rail.appendChild(s)});
  vw=document.createElement('div');vw.className='vw';rail.appendChild(vw);drawRail()}
function drawRail(){if(!vw)return;const H=grid.scrollHeight;vw.style.top=(sc.scrollTop/H*100)+'%';vw.style.height=Math.max(2,sc.clientHeight/H*100)+'%'}
let rdown=false;
function railGo(e){const r=rail.getBoundingClientRect();sc.scrollTop=(e.clientY-r.top)/r.height*grid.scrollHeight-sc.clientHeight/2;stop()}
rail.addEventListener('pointerdown',e=>{rdown=true;rail.setPointerCapture(e.pointerId);railGo(e)});
rail.addEventListener('pointermove',e=>{if(rdown)railGo(e)});
rail.addEventListener('pointerup',()=>rdown=false);

// autoplay
let playing=false,last=0;const pb=$('#play');
function stop(){if(playing){playing=false;pb.setAttribute('aria-pressed','false');pb.textContent='처음부터 재생'}}
function tick(t){if(!playing)return;const dt=Math.min(.05,(t-(last||t))/1000);last=t;sc.scrollTop+=dt*Math.max(60,sc.clientHeight*.14);
  if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-2){stop();return}requestAnimationFrame(tick)}
pb.onclick=()=>{if(playing){stop();return}closeDetail();sc.scrollTop=0;playing=true;last=0;pb.setAttribute('aria-pressed','true');pb.textContent='멈춤';requestAnimationFrame(tick)};
['wheel','touchstart','keydown'].forEach(ev=>sc.addEventListener(ev,stop,{passive:true}));
$('#top').onclick=()=>{stop();sc.scrollTo({top:0,behavior:reduce?'auto':'smooth'})};

// era chips
const ec=$('#eraChips');
ERAS.forEach((e,i)=>{const b=document.createElement('button');b.innerHTML=`<i style="background:${e[4]}"></i>${e[2]}`;
  b.onclick=()=>{stop();const el=grid.querySelector('#era'+i);sc.scrollTo({top:el.offsetTop-lhEl.offsetHeight+1,behavior:reduce?'auto':'smooth'})};ec.appendChild(b)});
// lane chips: hide or show whole columns
const lc=$('#laneChips');
function applyLanes(){const on=LANES.filter(l=>l.on);grid.style.setProperty('--cols',on.length);
  LANES.forEach(l=>grid.querySelectorAll(`[data-k="${l.k}"]`).forEach(el=>el.classList.toggle('off',!l.on)));setLhh();buildRail();req()}
LANES.forEach(ln=>{const b=document.createElement('button');b.setAttribute('aria-pressed','true');b.innerHTML=`<i style="background:${ln.p[0]}"></i>${ln.n}`;
  b.onclick=()=>{if(ln.on&&LANES.filter(l=>l.on).length===1)return;ln.on=!ln.on;b.setAttribute('aria-pressed',ln.on);applyLanes()};lc.appendChild(b)});

// detail
const det=$('#detail');let sel=-1;
function select(i,go){if(sel>=0)cards[sel].classList.remove('on');sel=i;const d=DATA[i];const el=cards[i];el.classList.add('on');
  if(!LBY[d.l].on){LBY[d.l].on=true;lc.children[LBY[d.l].i].setAttribute('aria-pressed','true');applyLanes()}
  det.hidden=false;const s=det.querySelector('.sw');s.style.background=d.bg;s.style.color=d.fg;
  det.querySelector('.py').textContent=yl(d);det.querySelector('.hx').textContent=d.c?d.c.toUpperCase():'';
  det.querySelector('h2').textContent=d.t;det.querySelector('.pl').textContent=LBY[d.l].n;det.querySelector('.pd').textContent=d.d;
  const w=d.y<1500?120:d.y<1850?15:d.y<1990?2:0;
  const near=DATA.filter(o=>o.i!==i&&Math.abs(o.y-d.y)<=w).sort((a,b)=>Math.abs(a.y-d.y)-Math.abs(b.y-d.y)||a.i-b.i).slice(0,12);
  const ul=det.querySelector('ul');ul.innerHTML='';det.querySelector('h3').hidden=!near.length;
  near.forEach(o=>{const li=document.createElement('li'),b=document.createElement('button');b.innerHTML=`<i style="background:${o.bg}"></i><span>${yl(o)} ${o.t}</span>`;b.onclick=()=>select(o.i,true);li.appendChild(b);ul.appendChild(li)});
  if(go)el.scrollIntoView({block:'center',inline:'nearest',behavior:reduce?'auto':'smooth'})}
function closeDetail(){det.hidden=true;if(sel>=0)cards[sel].classList.remove('on');sel=-1}
det.querySelector('.x').onclick=closeDetail;
grid.addEventListener('click',e=>{const c=e.target.closest('.card');if(c){stop();select(+c.dataset.i,false)}});
grid.addEventListener('keydown',e=>{const c=e.target.closest('.card');if(c&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(+c.dataset.i,false)}});
addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});

// search
const q=$('#q'),qc=$('#qc');let hits=[],hp=-1;
q.addEventListener('input',()=>{const s=q.value.trim().toLowerCase();hits=[];hp=-1;
  DATA.forEach(d=>{const m=!s||(d.t+' '+d.d+' '+yl(d)+' '+LBY[d.l].n).toLowerCase().includes(s);cards[d.i].classList.toggle('dim',!m);if(s&&m)hits.push(d.i)});
  hits.sort((a,b)=>DATA[a].y-DATA[b].y||a-b);qc.textContent=s?hits.length+'건':''});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&hits.length){e.preventDefault();hp=(hp+1)%hits.length;stop();select(hits[hp],true);qc.textContent=`${hp+1}/${hits.length}`}});

addEventListener('resize',()=>{setLhh();buildRail();req()});
setLhh();buildRail();paint();
if(document.fonts)document.fonts.ready.then(()=>{setLhh();buildRail();req()});
</script>
</body>
