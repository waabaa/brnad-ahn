<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>운영 어드민 | 브랜드 아틀라스</title>
<link rel="icon" href="/assets/objects/brand_atlas_logo_mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div id="login">
  <form class="box" id="loginForm">
    <h1>브랜드 아틀라스 운영</h1>
    <p>관리자 비밀번호를 입력하세요.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" required>
    <button type="submit">로그인</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app">
  <aside class="sidebar">
    <div class="brand"><b>브랜드 아틀라스</b><span>OPERATIONS</span></div>
    <nav id="nav"></nav>
    <div class="foot">
      <div id="footInfo">—</div>
      <button id="logout">로그아웃</button>
    </div>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="title">대시보드</h1>
      <div class="meta" id="topMeta"></div>
    </div>
    <div class="wrap" id="panels"></div>
  </main>
</div>

<script src="app.js?v=20261113"></script>
</body>
</html>
